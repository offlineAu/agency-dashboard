                x-examples:
                  Example 1:
                    data:
                      list:
                        - id: 40001
                          name: John Smith
                          nickName: John
                          userName: john_smith_01
                          tagName: VIP
                          createdTime: '2026-02-27T10:15:00Z'
                          platformCode: OF
                        - id: 40002
                          name: Emily Brown
                          nickName: Em
                          userName: emily_b
                          tagName: NewFan
                          createdTime: '2026-02-26T18:45:00Z'
                          platformCode: FANSLY
                    cursor: eyJpZCI6NDAwMDJ9
                    hasMore: true
                    errorMessage: null
                properties:
                  data:
                    type: object
                    description: 'Returned upon success, corresponding to the specific business data structure.'
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Unique identifier(Creator ID)
                            name:
                              type: string
                              description: Creator name
                            nickName:
                              type: string
                              description: Nickname
