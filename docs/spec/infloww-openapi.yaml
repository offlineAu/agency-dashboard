        - $ref: '#/components/parameters/platformCode'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      description: |-
        Get a paginated list of all creators under your agency, including connected, disconnected, not connected, 2FA required, and deleted creators.

        > This endpoint requires the "All Creators" scope permission. Unlike `/v1/creators`, it returns all creators regardless of their connection status.
