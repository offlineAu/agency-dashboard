components:
  schemas: {}
  parameters:
    platformCode:
      name: platformCode
      in: query
      required: false
      schema:
        type: string
        format: enum
        default: OnlyFans
        enum:
          - OnlyFans
      description: Platform code.
      deprecated: false
    creatorId:
      name: creatorId
      in: query
      required: true
      schema:
        type: number
      description: 'We will validate the relationship between `creatorId` , `platformCode`, and `oid`.'
    creatorIds:
      name: creatorIds
      in: query
      required: true
      schema:
        type: array
        items:
          type: number
        minItems: 1
        maxItems: 10
      description: A list of creator IDs to filter by. Required for Creator Report endpoints. Maximum of 10 creator IDs per request.
    employeeId:
      name: employeeId
      in: query
      schema:
        type: number
      description: Unique identifier for the employee. Required for employee-creator assignment queries.
      required: true
    employeeIds:
      name: employeeIds
      in: query
      schema:
        type: array
        items:
          type: number
        format: number
        maxItems: 100
        minItems: 1
      description: A list of employee IDs to filter by.
      required: true
    optionalEmployeeId:
      name: employeeId
      in: query
      required: false
      schema:
        type: number
      description: Unique identifier for the employee. Optional filter for message endpoints.
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: number
      description: Pagination cursor for retrieving next page of results
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: number
        maximum: 100
        exclusiveMinimum: 0
        default: 10
      description: Maximum number of records to return.
    startTime:
      name: startTime
      in: query
      schema:
        type: string
        example: '"1704067200000" | "2024-01-01T00:00:00Z" | "2024-01-01T00:00:00.000Z"'
      description: The start time for record list. We accept **unix timestamp in milliseconds** and **ISO 8601 date-time in UTC+0**. Query range is limited to 31 days per request.
      required: true
    endTime:
      name: endTime
      in: query
      schema:
        type: string
        description: |
          The inclusive end time for filtering records, based on the creation time.
          **Accepted Formats:**
          1.  Unix millisecond timestamp (e.g., `1706745599000`)
          2.  ISO 8601 date-time in UTC (e.g., `2024-01-31T23:59:59Z` or `2024-01-31T23:59:59.999Z`)
          **Query Logic:**
          *   If `endTime` is **not** provided, the query spans from the `startTime` to the current time.
        example: '"1706745599000" | "2024-01-31T23:59:59Z" | "2024-01-31T23:59:59.999Z"'
      description: The end time for record list. We accept **unix timestamp in milliseconds** and **ISO 8601 date-time in UTC+0**. Query range is limited to 31 days per request.
      required: true
    reportStartTime:
      name: startTime
      in: query
      schema:
        type: string
        format: date
        default: '{{3-day before endTime}}'
        example: '"2024-01-01"'
      description: The start date for record list. Accepts **ISO 8601 date format (YYYY-MM-DD)**. Query range is limited to 31 days per request and up to 366 days in the past.
      required: true
    reportEndTime:
      name: endTime
      in: query
      schema:
        type: string
        format: date
        example: '"2024-01-31"'
      description: The end date for record list. Accepts **ISO 8601 date format (YYYY-MM-DD)**. Query range is limited to 31 days per request and up to 366 days in the past.
      required: true
    Authorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
        default: '{{your_api_key}}'
      description: Generated in the Infloww client's API key management page.
    x-oid:
      name: x-oid
      in: header
      required: true
      schema:
        type: string
        default: '{{your_oid}}'
      description: View in the Infloww client's API key management page.
    linkType:
      name: linkType
      in: query
      required: true
      schema:
        type: string
        format: enum
        enum:
          - CAMPAIGN
          - TRIAL
          - TRACKING
      description: We will validate the relationship between `linkType` and `platformCode`
    status:
      name: status
      in: query
      schema:
        type: string
        format: enum
        enum:
          - ACTIVE
          - DEACTIVATED
      description: Filter links by status. Not applicable when `linkType` is `CAMPAIGN`. (V1.4)
    employeeIds-10limit:
      name: employeeIds
      in: query
      required: true
      schema:
        type: array
        minLength: 0
        maxLength: 10
        format: number
        minItems: 1
        maxItems: 10
      description: A list of employee IDs to filter by.
  responses:
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            x-examples:
              Example 1:
                errorMessage: limit must be less than or equal to 100
            properties:
              errorMessage:
                type: string
                description: Detail error message.
          examples:
            Example 1:
              value:
                errorMessage: limit must be less than or equal to 100
      headers: {}
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            x-examples:
              Example 1:
                errorMessage: invalid api key
            properties:
              errorMessage:
                type: string
                description: |
                  Detail error message.
          examples:
            Example 1:
              value:
                errorMessage: invalid api key
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            x-examples:
              Example 1:
                errorMessage: Your ip address is not allowed
            properties:
              errorMessage:
                type: string
                description: Detail error message.
          examples:
            Example 1:
              value:
                errorMessage: Your ip address is not allowed
    '429':
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            x-examples:
              Example 1:
                errorMessage: Your ip address is not allowed
            properties:
              errorMessage:
                type: string
                description: Detail error message.
          examples:
            Example 1:
              value:
                errorMessage: Too Many Requests
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            x-examples:
              Example 1:
                errorMessage: Internal Server Error
            properties:
              errorMessage:
                type: string
                description: Detail error message.
          examples:
            Example 1:
              value:
                errorMessage: Internal Server Error
